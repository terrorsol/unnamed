# One-click deploy: https://render.com/deploy?repo=https://github.com/terrorsol/unnamed
# Starter instance (always-on; the MM bot must not sleep) + 1GB disk at /data for vault keys, fills, tapes.
services:
  - type: web
    name: unnamed-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: starter
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: "10000"
      - key: RPC_URL
        sync: false   # Helius mainnet URL (paste at deploy)
      - key: TREASURY
        sync: false   # fee wallet pubkey
      - key: VAULT_SECRET
        generateValue: true
      - key: VAULT_KEY
        sync: false   # base58 secret of the brand wallet (BANK…): every vault trades from it, so it is the top holder on every coin. Unset = one fresh key per vault
      - key: MAX_CHEST_SOL
        value: "2"    # beta: no chest holds more than this
      - key: MM_BUYS
        value: "0"    # beta: vaults never buy from the pool (no dip tranches / accumulation) — captures, the standing ask and the desk bid still run. Set 1 for the full policy
      - key: MINT_SUFFIX
        value: "BANK" # launched mints end in this; pool fed by `npm run mints -- grind 50 push <url> <ADMIN_KEY>` from any machine with solana-keygen
      - key: PINATA_JWT
        sync: false   # pinata.cloud JWT for launch metadata (pump.fun/api/ipfs is dead)
      - key: PUMPPORTAL_KEY
        sync: false   # optional: pumpportal api key (token-trade stream for curve coins; metered)
      - key: JITO
        value: "0"    # 1 = vault trades as Jito bundles via PumpPortal bundle mode (default: Helius Sender)
      - key: PLATFORM_ADMIN
        sync: false   # optional: a wallet to be the LaunchLab platform admin. Unset = the server key is admin and creates the config itself once its wallet holds 0.02 SOL
      - key: GATE
        value: "1"    # private beta: every write needs a session from a redeemed invite key (npm run invites -- 10 "wave 1" on the server shell)
      - key: ADMIN_KEY
        sync: false   # any long random string: GET /invite/redeemed?key=… lists who redeemed which key
      - key: TAX_BPS
        value: "200"  # platform fee on every curve trade of a coin launched here → that coin's chest (max 500)
      - key: CREATOR_FEE_BPS
        value: "0"    # on-chain creator fee (max 50). 0: the dev earns from the vault cut only
      - key: PERM_TAX_BPS
        value: "0"    # token-2022 transfer tax on every move incl. buys (max 500). 0 = off
