name: Refill …BANK mints (grind + push to the server)
# Grinds vanity mint keypairs ending in BANK on the runner and pushes them straight into the live server's pool over /admin/mints.
# The secrets never touch the repo or the logs: they go from the runner's disk to the server (encrypted there with VAULT_SECRET) and are deleted.
on:
  workflow_dispatch:
    inputs:
      n: { description: 'how many', default: '30' }
  push:
    branches: [main]
    paths: ['.github/workflows/mints.yml']
permissions:
  contents: write
jobs:
  mints:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SERVER: ${{ vars.SERVER_URL || 'https://unnamed-server.onrender.com' }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - name: Install solana-keygen
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)" >/dev/null
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Grind and push in small batches (each batch reaches the server before the next starts; secrets never leave the runner otherwise)
        working-directory: server
        run: |
          { test -n "$ADMIN_KEY" && echo "admin key: present" || echo "admin key: MISSING"; echo "cores: $(nproc)"; echo "start $(date -u +%H:%M)"; } > /tmp/mints.txt
          want=${{ github.event.inputs.n || '30' }}; got=0; end=$(( $(date +%s) + 65*60 ))
          while [ $got -lt $want ] && [ $(date +%s) -lt $end ]; do
            out=$(npm run --silent mints -- grind 2 push "$SERVER" "$ADMIN_KEY" 2>&1 | grep -E "^pushed|nothing to push|Error|failed" | tail -2)
            echo "$(date -u +%H:%M) $out" >> /tmp/mints.txt; got=$((got + 2))
            # progress out after every batch (counts only)
            ( R=https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git; rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub && git init -q && git checkout -qb reports-mints && git config user.name unnamed-ci && git config user.email ci@unnamed.local && cp /tmp/mints.txt mints.txt && git add -A && git commit -qm progress && git push -qf $R reports-mints ) || true
          done
          rm -rf mints; cat /tmp/mints.txt
      - name: Publish the result (counts only, no keys)
        if: always()
        run: |
          R=https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          mkdir -p /tmp/pub && cd /tmp/pub && git init -q && git checkout -qb reports-mints && git config user.name unnamed-ci && git config user.email ci@unnamed.local
          cp /tmp/mints.txt mints.txt 2>/dev/null || echo "no output" > mints.txt; date -u >> mints.txt
          git add -A && git commit -qm "mints ${{ github.run_id }}" && git push -qf $R reports-mints
