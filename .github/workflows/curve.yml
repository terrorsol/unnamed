name: Curve (read-only pool state of one coin)
on:
  push:
    branches: [curve]
permissions:
  contents: write
jobs:
  curve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - name: Curve
        working-directory: server
        env:
          RPC_URL: ${{ secrets.HELIUS_RPC }}
          MINT: nUCiRZJQz1xGbGpM5FthfiF8ZUiDqsy9QcnwxvFBANK
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: timeout 780 node --experimental-strip-types scripts/curve.ts > curve.txt 2>&1 || true; cat curve.txt
      - name: Publish
        if: always()
        run: |
          rm -rf /tmp/pub; mkdir -p /tmp/pub && cp server/curve.txt /tmp/pub/ 2>/dev/null || echo "no output" > /tmp/pub/curve.txt
          cd /tmp/pub && git init -q && git checkout -qb reports-curve && git config user.name unnamed-ci && git config user.email ci@unnamed.local
          git add -A && git commit -qm "curve $(date -u +%H:%M:%S)" && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git reports-curve
