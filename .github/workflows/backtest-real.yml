name: Real-flow backtest (50-100 coins)
on:
  workflow_dispatch:
    inputs:
      n: { description: 'coins to pull', default: '80' }
  schedule:
    - cron: '17 9 * * *'   # daily, fresh coins
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: app
      - name: Pull real flow from GeckoTerminal and replay through the vault rules
        working-directory: app
        run: node --experimental-strip-types scripts/scrape.mjs --n ${{ github.event.inputs.n || '80' }} --out data/real
      - name: Publish dataset + report to the reports branch
        if: always()
        run: |
          set -e
          cp -r app/data/real /tmp/real
          git config user.name unnamed-ci && git config user.email ci@unnamed.local
          git fetch origin reports:reports 2>/dev/null || true
          git checkout reports 2>/dev/null || git checkout --orphan reports
          rm -rf real && mkdir -p real && cp /tmp/real/* real/
          git add -A && git commit -qm "real-flow backtest ${{ github.run_id }}" || true
          git push -f origin reports
