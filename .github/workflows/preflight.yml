name: Mainnet preflight (no funds)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/preflight.yml']
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - name: Preflight every live integration against mainnet (simulate only)
        working-directory: server
        env:
          RPC_URL: ${{ secrets.HELIUS_RPC || 'https://mainnet.helius-rpc.com/?api-key=1372a143-458e-4428-a1f2-aacb1e44bd1a' }}
          JUP_KEY: ${{ secrets.JUP_KEY }}
        run: node --experimental-strip-types scripts/preflight.ts
      - name: Publish report to the reports branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/pub && cp -r server/reports/. /tmp/pub/
          cd /tmp/pub && git init -q && git checkout -qb reports-preflight && git config user.name unnamed-ci && git config user.email ci@unnamed.local
          git add -A && git commit -qm "preflight ${{ github.run_id }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git reports-preflight
