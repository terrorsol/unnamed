name: Build and publish to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test
      - name: Server tests
        working-directory: server
        run: npm ci && npm test
      - name: Build app
        working-directory: app
        env:
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
        run: npm run build -- --base=/
      - name: Assemble site (app.banker.cash)
        run: |
          mkdir -p site/app
          cp -r app/dist/* site/
          # old links (…/unnamed/app/#/?key=…) land on /app/ after github's custom-domain redirect: bounce to the root, keeping the hash
          printf '<!doctype html><meta charset=utf-8><title>BANKER</title><script>location.replace("/" + location.hash)</script><a href="/">open BANKER</a>' > site/app/index.html
          echo app.banker.cash > site/CNAME
          touch site/.nojekyll
      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    continue-on-error: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
