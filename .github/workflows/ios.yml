# Builds the BANKER iPhone app from app/ (the same code as app.banker.cash, wrapped with Capacitor).
# Run it from the Actions tab. Without secrets it does a simulator build (proves it compiles).
# With the App Store Connect secrets below and upload=true it signs, archives and sends the build to TestFlight.
#   APPLE_TEAM_ID        10-character team id (developer.apple.com → Membership)
#   ASC_KEY_ID           App Store Connect API key id  (App Store Connect → Users and Access → Integrations)
#   ASC_ISSUER_ID        issuer id shown on that same page
#   ASC_KEY_P8_BASE64    the downloaded AuthKey_XXXX.p8, base64-encoded
name: ios
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign and upload to TestFlight (needs the secrets)'
        type: boolean
        default: false
      build_number:
        description: 'Build number (must go up each upload)'
        default: '1'
      store_safe:
        description: 'Hide coin launching in the phone app (for a cautious first review)'
        type: boolean
        default: false
jobs:
  build:
    runs-on: macos-15
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
        env: { VITE_STORE_SAFE: "${{ inputs.store_safe && '1' || '' }}" }
      - name: iOS project
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
          node scripts/ios-plist.mjs
          npx @capacitor/assets generate --ios --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' --assetPath resources || echo "icons: using defaults"
      - name: Simulator build (no signing)
        if: ${{ !inputs.upload }}
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/keys && echo "$P8" | base64 --decode > ~/keys/AuthKey.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/keys/AuthKey.p8 -authenticationKeyID $KID -authenticationKeyIssuerID $ISS"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/BANKER.xcarchive DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ inputs.build_number }} $AUTH archive | tail -20
          cat > $RUNNER_TEMP/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/BANKER.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out $AUTH | tail -20
